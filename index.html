<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Produtos</title>
   
</head>
<body>
 <h2>Cadastrar Produto</h2>
 <form id="form-produto">
    <label>Nome: <input type="text" id="nome" required></label>
    <br>
    <br>
    <label>Preço: <input type="number" step="0.01" id="preco" required></label>
    <br>
    <br>
    <label>Categoria: <input type="text" id="categoria" required></label>
    <br>
    <br>
    <label>Estoque: <input type="number" id="estoque" required></label>
    <br>
    <br>
    <button type="submit">Adicionar produto</button>
    <br>
    <br>

<h2>Listar bebidas</h2>
<button onclick="carregarBebidas()">Carregar bebidas</button>
<ul id="listar-bebidas"></ul>

</form>   

<script>
        const URL = "http://localhost:3000/produtos";

       
        document.getElementById("formProduto").onsubmit = async (e) => {
            e.preventDefault();
            
            const novoProduto = {
                nome: document.getElementById("nome").value,
                preco: Number(document.getElementById("preco").value),
                categoria: document.getElementById("categoria").value,
                estoque: Number(document.getElementById("estoque").value)
            };

            await fetch(URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(novoProduto)
            });

            alert("Produto cadastrado com sucesso!");
            location.reload();
        };

       
        async function carregarBebidas() {
            const resposta = await fetch(URL);
            const produtos = await resposta.json();
            const ul = document.getElementById("listaBebidas");
            
            ul.innerHTML = "";
            
            produtos
                .filter(p => p.categoria.toLowerCase() === "bebidas")
                .forEach(p => {
                    ul.innerHTML += <li>${p.nome} - R$ ${p.preco} (Estoque: ${p.estoque})</li>;
                });
        }  
</script>

</body>
</html>
